<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1117">
<title>Kolok — notre recherche de coloc</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏠</text></svg>">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>

<!-- ══════════ ÉCRAN "QUI ES-TU ?" ══════════ -->
<div id="whoami" class="who hidden">
  <div class="who-box">
    <div class="who-logo">🏠</div>
    <h1>Kolok</h1>
    <p>Qui es-tu&nbsp;?</p>
    <div id="whoBtns" class="who-btns"></div>
  </div>
</div>

<!-- ══════════ HEADER ══════════ -->
<header class="topbar">
  <div class="topbar-in">
    <div class="brand">🏠 <span>Kolok</span></div>

    <label class="search">
      <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Rechercher (ville, titre, note…)" autocomplete="off">
    </label>

    <div class="topbar-right">
      <button id="btnAdd" class="btn btn-primary">
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
        <span>Ajouter</span>
      </button>
      <button id="btnMe" class="me" title="Changer d'utilisateur"></button>
    </div>
  </div>

  <!-- Barre de filtres -->
  <div class="filters">
    <div class="chips" id="statusChips"></div>
    <div class="filters-right">
      <label class="mini">
        Max <input id="maxPrice" type="number" min="0" step="50" placeholder="€" inputmode="numeric">
      </label>
      <select id="sort" class="mini-select">
        <option value="recent">Plus récents</option>
        <option value="price_asc">Prix ↑</option>
        <option value="price_desc">Prix ↓</option>
        <option value="score">Mieux notés</option>
        <option value="surface">Surface ↓</option>
      </select>
      <button id="btnCompare" class="mini-btn" title="Vue comparatif">⇄ Comparer</button>
    </div>
  </div>
</header>

<!-- ══════════ STATS ══════════ -->
<div class="stats" id="stats"></div>

<!-- ══════════ CONTENU ══════════ -->
<main id="main">
  <div id="grid" class="grid"></div>
  <div id="empty" class="empty hidden">
    <div class="empty-emoji">🗂️</div>
    <h2>Aucun logement ici</h2>
    <p>Colle une annonce (Leboncoin, SeLoger, PAP, Facebook…) et elle se remplit toute seule.</p>
    <button class="btn btn-primary" onclick="document.getElementById('btnAdd').click()">Ajouter le premier logement</button>
  </div>
  <div id="compare" class="compare hidden"></div>
</main>

<!-- ══════════ MODALE : AJOUT / ÉDITION ══════════ -->
<div id="editModal" class="modal hidden">
  <div class="modal-card">
    <header class="modal-head">
      <h2 id="editTitle">Nouveau logement</h2>
      <button class="icon-btn" data-close>✕</button>
    </header>

    <div class="modal-body">
      <div class="field">
        <label for="fUrl">Lien de l'annonce</label>
        <div class="url-row">
          <input id="fUrl" type="url" placeholder="https://www.leboncoin.fr/…" autocomplete="off">
          <button id="btnFetch" class="btn btn-ghost">✨ Remplir</button>
        </div>
        <small id="fetchMsg" class="hint"></small>
      </div>

      <div class="field">
        <label for="fTitle">Titre</label>
        <input id="fTitle" type="text" placeholder="T3 lumineux — Croix-Rousse">
      </div>

      <div class="row-3">
        <div class="field">
          <label for="fPrice">Loyer /mois (€)</label>
          <input id="fPrice" type="number" min="0" inputmode="numeric" placeholder="1200">
        </div>
        <div class="field">
          <label for="fSurface">Surface (m²)</label>
          <input id="fSurface" type="number" min="0" inputmode="numeric" placeholder="75">
        </div>
        <div class="field">
          <label for="fRooms">Chambres</label>
          <input id="fRooms" type="number" min="0" inputmode="numeric" placeholder="3">
        </div>
      </div>

      <div class="row-2">
        <div class="field">
          <label for="fCity">Ville / quartier</label>
          <input id="fCity" type="text" placeholder="Lyon 4e">
        </div>
        <div class="field">
          <label for="fStatus">Statut</label>
          <select id="fStatus"></select>
        </div>
      </div>

      <div class="row-2">
        <div class="field">
          <label for="fContactedBy">Contacté par</label>
          <select id="fContactedBy"></select>
        </div>
        <div class="field">
          <label for="fVisitAt">Date de visite</label>
          <input id="fVisitAt" type="date">
        </div>
      </div>

      <div class="field">
        <label for="fImage">Image (URL, optionnel)</label>
        <input id="fImage" type="url" placeholder="https://…jpg">
      </div>

      <div class="field">
        <label for="fNotes">Notes communes</label>
        <textarea id="fNotes" rows="3" placeholder="Infos utiles : charges, dispo, contact de l'agence…"></textarea>
      </div>
    </div>

    <footer class="modal-foot">
      <button id="btnDelete" class="btn btn-danger hidden">Supprimer</button>
      <div class="spacer"></div>
      <button class="btn btn-ghost" data-close>Annuler</button>
      <button id="btnSave" class="btn btn-primary">Enregistrer</button>
    </footer>
  </div>
</div>

<!-- ══════════ PANNEAU : DÉTAIL ══════════ -->
<div id="detail" class="modal hidden">
  <div class="modal-card modal-card-lg" id="detailCard"></div>
</div>

<!-- ══════════ TOAST ══════════ -->
<div id="toast" class="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
